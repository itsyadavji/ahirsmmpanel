<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ahir SMM Panel</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(180deg,#fff8f3,#ffab0b);
    color:#171717;
}

/* HEADER */
header{
    height:100px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    box-shadow:0 2px 12px rgba(0,0,0,.12);
}

.logo{
    font-size:30px;
    font-weight:800;
    color:#169bc2;
}

.menu{
    width:82px;
    height:64px;
    border:2px solid #e56d2d;
    border-radius:8px;
    background:white;
    color:#e56d2d;
    font-size:40px;
    line-height:50px;
}

/* MAIN */
.container{
    max-width:630px;
    margin:80px auto;
    padding:20px;
}

.login-card{
    background:white;
    border:2px solid #e5e5e5;
    border-radius:8px;
    padding:38px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.login-card h2{
    font-size:30px;
    margin-bottom:35px;
}

/* INPUT */
label{
    display:block;
    font-size:18px;
    font-weight:bold;
    margin:22px 0 9px;
}

input{
    width:100%;
    height:62px;
    padding:0 20px;
    border:0;
    border-radius:15px;
    background:#fff3ed;
    font-size:20px;
    outline:none;
}

input:focus{
    box-shadow:0 0 0 2px #f47721;
}

/* REMEMBER */
.remember{
    display:flex;
    align-items:center;
    gap:10px;
    margin:25px 0;
    font-size:18px;
}

.remember input{
    width:30px;
    height:30px;
}

/* BUTTON */
button{
    width:100%;
    height:62px;
    border:0;
    border-radius:12px;
    background:#f86b0b;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 0 #c95400;
}

button:active{
    transform:translateY(2px);
    box-shadow:none;
}

.forgot{
    display:block;
    text-align:center;
    color:#d96b3b;
    font-size:20px;
    margin:25px 0 60px;
    cursor:pointer;
}

.no-account{
    text-align:center;
    font-size:20px;
    color:#555;
}

.create{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#e76328;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

.google{
    margin-top:30px;
    background:#f86b0b;
}

/* REGISTER */
.hidden{
    display:none;
}

.message{
    margin-top:15px;
    padding:12px;
    background:#fff1e8;
    border-radius:8px;
    text-align:center;
    color:#d35400;
}

/* DASHBOARD */
.dashboard-card{
    background:white;
    border-radius:15px;
    padding:30px;
    text-align:center;
}

.dashboard-card h2{
    font-size:30px;
    margin-bottom:15px;
}

.dashboard-card p{
    color:#666;
    font-size:18px;
    margin-bottom:25px;
}

.dashboard-btn{
    margin-top:15px;
}

/* FLOATING BUTTONS */
.float{
    position:fixed;
    right:18px;
    width:65px;
    height:65px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:30px;
    text-decoration:none;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
}

.telegram{
    bottom:95px;
    background:#229ed9;
}

.whatsapp{
    bottom:20px;
    background:#25d366;
}

/* MOBILE */
@media(max-width:600px){

    header{
        height:90px;
        padding:0 20px;
    }

    .logo{
        font-size:24px;
    }

    .menu{
        width:70px;
        height:55px;
        font-size:32px;
    }

    .container{
        margin:55px auto;
        padding:15px;
    }

    .login-card{
        padding:30px 25px;
    }

    .login-card h2{
        font-size:28px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">AHIR SMM PANEL</div>
    <button class="menu" onclick="alert('Menu coming soon')">☰</button>
</header>


<div class="container">

<!-- LOGIN -->
<div id="loginPage" class="login-card">

    <h2>Username</h2>

    <input
        id="loginUsername"
        type="text"
        placeholder="Username"
    >

    <label>Password</label>

    <input
        id="loginPassword"
        type="password"
        placeholder="Password"
    >

    <div class="remember">
        <input id="remember" type="checkbox">
        <span>Remember me</span>
    </div>

    <button onclick="login()">Log In</button>

    <div class="forgot" onclick="forgotPassword()">
        Forgot Password?
    </div>

    <div class="no-account">
        Do not have an account?
    </div>

    <div class="create" onclick="showRegister()">
        Create Account
    </div>

    <button class="google" onclick="googleMessage()">
        G+ Signin with Google+
    </button>

    <div id="loginMessage"></div>

</div>


<!-- REGISTER -->
<div id="registerPage" class="login-card hidden">

    <h2>Create Account</h2>

    <label>Username</label>

    <input
        id="regUsername"
        type="text"
        placeholder="Username"
    >

    <label>Password</label>

    <input
        id="regPassword"
        type="password"
        placeholder="Password"
    >

    <label>Confirm Password</label>

    <input
        id="regConfirm"
        type="password"
        placeholder="Confirm Password"
    >

    <button onclick="register()">
        Create Account
    </button>

    <div class="create" onclick="showLogin()">
        Already have an account? Login
    </div>

    <div id="registerMessage"></div>

</div>


<!-- DASHBOARD -->
<div id="dashboardPage" class="dashboard-card hidden">

    <h2>
        Welcome, <span id="usernameDisplay"></span> 👋
    </h2>

    <p>
        Welcome to Ahir SMM Panel.
    </p>

    <button onclick="alert('New Order feature coming soon')">
        🛒 New Order
    </button>

    <button class="dashboard-btn"
            onclick="alert('Orders feature coming soon')">
        📦 My Orders
    </button>

    <button class="dashboard-btn"
            onclick="alert('Wallet feature coming soon')">
        💰 Wallet
    </button>

    <button class="dashboard-btn"
            onclick="logout()">
        Logout
    </button>

</div>

</div>


<!-- FLOATING BUTTONS -->
<a class="float telegram"
   href="#"
   onclick="alert('Add your Telegram link here')">
   ✈
</a>

<a class="float whatsapp"
   href="#"
   onclick="alert('Add your WhatsApp link here')">
   ☎
</a>


<script>

function showRegister(){

    document.getElementById("loginPage")
        .classList.add("hidden");

    document.getElementById("registerPage")
        .classList.remove("hidden");
}


function showLogin(){

    document.getElementById("registerPage")
        .classList.add("hidden");

    document.getElementById("dashboardPage")
        .classList.add("hidden");

    document.getElementById("loginPage")
        .classList.remove("hidden");
}


function register(){

    let username =
        document.getElementById("regUsername")
        .value.trim();

    let password =
        document.getElementById("regPassword")
        .value;

    let confirm =
        document.getElementById("regConfirm")
        .value;

    let message =
        document.getElementById("registerMessage");


    if(username === "" ||
       password === "" ||
       confirm === ""){

        message.innerHTML =
        '<div class="message">Please fill all fields.</div>';

        return;
    }


    if(password !== confirm){

        message.innerHTML =
        '<div class="message">Passwords do not match.</div>';

        return;
    }


    localStorage.setItem(
        "ahir_username",
        username
    );

    localStorage.setItem(
        "ahir_password",
        password
    );


    message.innerHTML =
    '<div class="message">Account created successfully!</div>';


    setTimeout(function(){

        showLogin();

    },1000);
}


function login(){

    let username =
        document.getElementById("loginUsername")
        .value.trim();

    let password =
        document.getElementById("loginPassword")
        .value;

    let savedUsername =
        localStorage.getItem("ahir_username");

    let savedPassword =
        localStorage.getItem("ahir_password");


    if(username === savedUsername &&
       password === savedPassword){

        document.getElementById("loginPage")
            .classList.add("hidden");

        document.getElementById("dashboardPage")
            .classList.remove("hidden");

        document.getElementById("usernameDisplay")
            .innerText = username;

    }else{

        document.getElementById("loginMessage")
            .innerHTML =
        '<div class="message">Wrong username or password.</div>';
    }
}


function logout(){

    document.getElementById("dashboardPage")
        .classList.add("hidden");

    document.getElementById("loginPage")
        .classList.remove("hidden");
}


function forgotPassword(){

    alert("Password recovery will be added later.");
}



</script>

</body>
</html>
